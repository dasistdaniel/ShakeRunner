<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>ShakeRunner Social Preview (Generator)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>body { margin: 0; background: #222; } canvas { display: block; max-width: 100%; }</style>
</head>
<body>
<!-- Zeichnet social-preview.png (1280x640) mit den Sprites des Spiels. Speichern: Rechtsklick auf das Bild,
     oder per Skript: canvas.toBlob(...). Aufruf über den lokalen Server: /tools/social-preview.html -->
<canvas id="c" width="1280" height="640"></canvas>
<script type="module">
import { makeSprite, FRAMES, PAL, CALM_PAL } from '../src/render.js';

await document.fonts.load('40px "Press Start 2P"');
const W = 1280, H = 640, SPLIT = 760, GROUND = 500;
const c = document.getElementById('c');
const g = c.getContext('2d');
g.imageSmoothingEnabled = false;
const FONT = '"Press Start 2P", monospace';

function rng(seed) { let s = seed; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function lerp(a, b, t) {
  const p = (x) => [1, 3, 5].map((i) => parseInt(x.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`;
}
const rect = (x, y, w, h, color) => { g.fillStyle = color; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
function text(str, x, y, size, color, shadow, align = 'left') {
  g.font = `${size}px ${FONT}`;
  g.textAlign = align;
  if (shadow) { g.fillStyle = shadow; g.fillText(str, x + Math.max(3, size / 12), y + Math.max(3, size / 12)); }
  g.fillStyle = color;
  g.fillText(str, x, y);
}
const sprite = (rows, pal) => makeSprite(rows, pal);

// ---------- linke Hälfte: Neon ----------
g.save();
g.beginPath(); g.rect(0, 0, SPLIT, H); g.clip();
for (let i = 0; i < 16; i++) rect(0, i * 32, SPLIT, 32, lerp('#0a0620', '#8a1a78', i / 15));
const r = rng(5);
for (let i = 0; i < 40; i++) rect(Math.floor(r() * SPLIT), Math.floor(r() * 260), 3, 3, '#ffffff');
// Sonne mit Streifen
const cx = 560, cy = 400, R = 190;
for (let dy = -R; dy <= R; dy += 4) {
  if (dy > 20 && ((dy - 20) % 36) < 14 + (dy / R) * 12) continue;
  const hw = Math.floor(Math.sqrt(R * R - dy * dy));
  rect(cx - hw, cy + dy, hw * 2, 4, dy < 0 ? '#ffe14d' : dy < 80 ? '#ff9a3c' : '#ff2e88');
}
// Skyline
for (const [seed, minH, maxH, body] of [[7, 80, 230, '#1d1040'], [21, 50, 160, '#2a1260']]) {
  const rr = rng(seed);
  let x = -20;
  while (x < SPLIT) {
    const bw = 40 + Math.floor(rr() * 60), bh = minH + Math.floor(rr() * (maxH - minH));
    rect(x, GROUND - bh, bw, bh, body);
    if (body === '#2a1260') {
      for (let wy = GROUND - bh + 12; wy < GROUND - 12; wy += 18) {
        for (let wx = x + 8; wx < x + bw - 8; wx += 14) {
          if (rr() < 0.4) rect(wx, wy, 6, 9, ['#ffe14d', '#00e5ff', '#ff2e88'][Math.floor(rr() * 3)]);
        }
      }
    }
    x += bw + 4;
  }
}
// Boden mit Gitter
rect(0, GROUND, SPLIT, H - GROUND, '#14082b');
rect(0, GROUND, SPLIT, 5, '#00e5ff');
for (let x = -600; x <= 1400; x += 70) {
  for (let y = GROUND + 8; y < H; y += 4) rect(380 + (x - 380) * (1 + (y - GROUND) / 140 * 2), y, 3, 4, '#3a1d7a');
}
for (const k of [0.15, 0.4, 0.75]) rect(0, GROUND + (H - GROUND) * k, SPLIT, 3, '#3a1d7a');
// Läufer
const S1 = 16;
g.drawImage(sprite(FRAMES.runB, PAL), 560, GROUND - 12 * S1, 8 * S1, 12 * S1);
// Titel
text('SHAKE', 60, 150, 84, '#00e5ff', '#ff2e88');
text('RUNNER', 60, 250, 84, '#00e5ff', '#ff2e88');
text('SCHÜTTLE DICH DURCH!', 60, 320, 24, '#ffe14d', '#000');
text('8-BIT ENDLESS RUNNER', 60, 380, 18, '#ffffff', '#000');
text('HARTER TECHNO-BEAT', 60, 415, 18, '#ffffff', '#000');
text('HANDY SCHÜTTELN = RENNEN', 60, 450, 18, '#ffffff', '#000');
text('dasistdaniel.github.io/ShakeRunner', 60, 600, 16, '#9b8fd1');
g.restore();

// ---------- rechte Hälfte: Rentner-Modus ----------
rect(SPLIT, 0, W - SPLIT, H, '#000');
rect(SPLIT, GROUND, W - SPLIT, H - GROUND, '#262626');
rect(SPLIT, GROUND, W - SPLIT, 6, '#ffffff');
for (let x = SPLIT + 20; x < W; x += 80) rect(x, GROUND + 40, 40, 6, '#ffffff');
rect(SPLIT - 4, 0, 8, H, '#ffe14d'); // Trennlinie

text('NEU:', 800, 90, 20, '#ffffff');
text('RENTNER-', 800, 160, 44, '#ffe14d');
text('MODUS', 800, 220, 44, '#ffe14d');

// Rollstuhl mit Rentner + Kevin (gleiche Maße wie im Spiel, skaliert)
const S2 = 12, OX = 930, OY = GROUND;
const u = (v) => v * S2;
const rr2 = (x, y, w, h, color) => rect(OX + u(x), OY + u(y), u(w), u(h), color);
const WHEEL = ['..wwwww..', '.w.....w.', 'w.......w', 'w.......w', 'w...w...w', 'w.......w', 'w.......w', '.w.....w.', '..wwwww..'];
const ZIVI_PAL = { b: '#39ff88', s: '#ffffff', k: '#000000', j: '#39ff88', p: '#39ff88', w: '#ffffff' };
const rentner = sprite(FRAMES.runA, CALM_PAL);
const kevin = sprite(FRAMES.runB, ZIVI_PAL);
const wheel = sprite(WHEEL, { w: '#ffffff' });
rr2(-3, -14, 4, 1, '#aaaaaa');                      // Schiebegriff
rr2(-1, -14, 2, 10, '#aaaaaa');                     // Rückenlehne
g.drawImage(rentner, 0, 0, 8, 8, OX, OY + u(-14), u(8), u(8)); // Oberkörper
rr2(-1, -4, 9, 1, '#aaaaaa');                       // Sitz
rr2(3, -6, 7, 2, '#00e5ff');                        // Oberschenkel
rr2(8, -4, 2, 3, '#00e5ff');                        // Unterschenkel
rr2(8, -1, 4, 1, '#ffe14d');                        // Schuhe
g.drawImage(wheel, OX + u(-1), OY + u(-9), u(9), u(9));
g.drawImage(kevin, OX + u(-11), OY + u(-12), u(8), u(12));
text('KEVIN', OX + u(-11), OY + 56, 14, '#39ff88');

// Pillen
const PILL = ['.wwwwwwww.', 'wBBBBLLLLw', 'wBBBBLLLLw', 'wBBBBLLLLw', 'wBBBBLLLLw', '.wwwwwwww.'];
g.drawImage(sprite(PILL, { w: '#ffffff', B: '#1f4fff', L: '#8fb8ff' }), 1120, 240, 90, 54);
g.drawImage(sprite(PILL, { w: '#ffffff', B: '#ff1f1f', L: '#ff9a9a' }), 1170, 320, 90, 54);

text('MIT ZIVI KEVIN, ROLLATOR,', 800, 580, 14, '#ffffff');
text('MOTORRAD & MATRIX', 800, 610, 14, '#ffffff');

window.done = true;
</script>
</body>
</html>
